name: Pruebas Android en emulador
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-pruebas
  cancel-in-progress: true
jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar la APK publicada y verificar su huella
        run: |
          mkdir -p out evidence
          curl -sL -o out/opcit.apk https://github.com/Xesco-Tejedor/OpCit/releases/download/android-latest/opcit.apk
          echo '60531f2c85ca3d5000474f1377aa8d3d7d94bb2cbc2c27542802fc3fa0952d83  out/opcit.apk' | sha256sum -c -
      - name: Verificar firma y paquete
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs out/opcit.apk | tee evidence/firma.txt
          "$BT/aapt" dump badging out/opcit.apk | grep -E '^(package|application-label)' | tee evidence/paquete.txt
      - uses: actions/checkout@v4
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador API 33 (instalación, arranque y pantalla)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/e2e-opcit.sh out/opcit.apk 33
